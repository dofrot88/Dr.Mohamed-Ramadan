<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة د. محمد رمضان التعليمية</title>
<style>
:root{--bg:#0b1220;--card:#111a2e;--line:#1e293b;--accent:#0ea5e9;--text:#f1f5f9;--muted:#94a3b8;--side:#0f172a;--btn:#2563eb;--ok:#10b981;--gold:#f59e0b}
*{box-sizing:border-box;margin:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
aside{width:230px;background:var(--side);border-left:1px solid var(--line);padding:22px 14px;position:fixed;top:0;bottom:0;right:0;z-index:10;display:flex;flex-direction:column}
.brand{text-align:center;margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand img{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid var(--accent);margin-bottom:8px}
.brand h2{font-size:1.15rem;color:#fff}
.brand span{font-size:.78rem;color:var(--accent)}
aside a{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;color:var(--muted);cursor:pointer;margin-bottom:6px;font-size:.92rem;transition:.2s}
aside a.on,aside a:hover{background:var(--btn);color:#fff;font-weight:600}
aside a.admin-link{margin-top:auto;border:1px dashed var(--gold);color:var(--gold)}
aside a.admin-link:hover{background:var(--gold);color:#000}
main{margin-right:230px;flex:1;min-width:0}
.top{background:rgba(15,23,42,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:9}
.top h3{color:#fff;font-size:1.1rem}
.top input{flex:1;max-width:400px;margin:0 auto;padding:9px 16px;border-radius:20px;border:1px solid var(--line);background:var(--bg);color:#fff;font:inherit}
.top .u{display:flex;gap:8px;align-items:center;font-size:.9rem}
.menu{display:none;background:none;border:0;color:#fff;font-size:1.5rem;cursor:pointer}
.wrap{padding:24px;max-width:1200px;margin:0 auto}

/* Hero Banner */
.hero{background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative;overflow:hidden}
.hero-text{flex:1;z-index:2}
.hero-text .tag{background:rgba(14,165,233,.15);color:var(--accent);padding:4px 12px;border-radius:20px;font-size:.8rem;font-weight:600;display:inline-block;margin-bottom:10px}
.hero-text h1{font-size:1.7rem;margin-bottom:8px;line-height:1.4}
.hero-text p{color:var(--muted);font-size:.95rem;margin-bottom:16px;max-width:540px;line-height:1.6}
.hero-imgs{display:flex;gap:12px;z-index:2}
.hero-imgs img{width:130px;height:165px;object-fit:cover;object-position:top;border-radius:12px;border:2px solid var(--accent);box-shadow:0 10px 25px rgba(0,0,0,.4)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center}
.stat b{display:block;font-size:1.8rem;margin-bottom:4px}.stat span{color:var(--muted);font-size:.85rem}

.tabs{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:var(--card);color:var(--text);border:1px solid var(--line);padding:8px 18px;border-radius:20px}
.tabs button.on{background:var(--btn);border-color:var(--btn)}

/* Course Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:var(--accent)}
.thumb-wrap{position:relative;height:190px;background:#1e293b;overflow:hidden}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .3s}
.card:hover .thumb-wrap img{transform:scale(1.05)}
.plan-tag{position:absolute;top:12px;right:12px;background:rgba(15,23,42,.85);backdrop-filter:blur(4px);color:var(--gold);border:1px solid var(--gold);padding:3px 12px;border-radius:20px;font-size:.78rem;font-weight:700}
.price-tag{position:absolute;bottom:12px;left:12px;background:var(--ok);color:#fff;padding:4px 12px;border-radius:8px;font-weight:800;font-size:.95rem;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.card-body{padding:16px;flex:1;display:flex;flex-direction:column}
.card h4{font-size:1.05rem;margin-bottom:8px;color:#fff}
.card p{color:var(--muted);font-size:.85rem;line-height:1.5;margin-bottom:16px;flex:1}
button{background:var(--btn);color:#fff;border:0;padding:11px 16px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600;transition:.2s}
button:hover{opacity:.9}
.card button{width:100%}
button.sec{background:transparent;border:1px solid var(--line);padding:7px 14px}
button:disabled{background:var(--ok);cursor:default}

dialog{border:1px solid var(--line);border-radius:16px;padding:24px;width:min(420px,92vw);background:var(--card);color:var(--text);margin:auto}
dialog::backdrop{background:rgba(0,0,0,.75);backdrop-filter:blur(3px)}
input.f,select.f,textarea.f{width:100%;padding:11px;margin:7px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.err{color:#f87171;font-size:.85rem;min-height:20px;margin-top:4px}

@media(max-width:850px){
 aside{transform:translateX(100%);transition:.25s}aside.open{transform:none}
 main{margin-right:0}.menu{display:block}
 .hero{flex-direction:column;text-align:center}
 .hero-imgs img{width:110px;height:140px}
 .stats{grid-template-columns:1fr}
}
</style>
</head>
<body>
<aside id="side">
  <div class="brand">
    <img src="dr1.jpg" onerror="this.style.display='none'" alt="د. محمد رمضان">
    <h2>د. محمد رمضان</h2>
    <span>المنصة التعليمية الرسمية</span>
  </div>
  <a data-v="home" class="on">🏠 الرئيسية</a>
  <a data-v="all">📚 جميع الكورسات</a>
  <a data-v="mine">🎓 كورساتي المشترك بها</a>
  <a id="acc">👤 حسابي</a>
  <a class="admin-link" onclick="openAdmin()">⚙️ إضافة كورس (للدكتور)</a>
</aside>

<main>
  <div class="top">
    <button class="menu" onclick="side.classList.toggle('open')">☰</button>
    <h3 id="title">الرئيسية</h3>
    <input id="q" placeholder="ابحث عن كورس..." oninput="render()">
    <div class="u" id="user"></div>
  </div>
  <div class="wrap" id="view"></div>
</main>

<!-- نافذة تسجيل الدخول / حساب جديد -->
<dialog id="dlg">
  <h3 id="dt" style="margin-bottom:12px"></h3>
  <input class="f" id="name" placeholder="الاسم بالكامل">
  <input class="f" id="phone" placeholder="رقم الموبايل (واتساب)">
  <input class="f" id="email" type="email" placeholder="البريد الإلكتروني">
  <input class="f" id="pass" type="password" placeholder="كلمة المرور (6 حروف على الأقل)">
  <div class="err" id="err"></div>
  <button onclick="submitAuth()" style="width:100%">تأكيد</button>
  <button class="sec" onclick="dlg.close()" style="width:100%;margin-top:8px">إلغاء</button>
</dialog>

<!-- نافذة لوحة تحكم الدكتور لإضافة كورس -->
<dialog id="adminDlg">
  <h3 style="margin-bottom:10px;color:var(--gold)">➕ إضافة كورس جديد للمنصة</h3>
  <input class="f" id="admPass" type="password" placeholder="باسورد الأدمن (الافتراضي: admin123)">
  <input class="f" id="cTitle" placeholder="اسم الكورس (مثال: كورس المراجعة النهائية)">
  <select class="f" id="cPlan">
    <option value="month">باقة الشهر (150 ج)</option>
    <option value="term">باقة الترم (450 ج)</option>
    <option value="year">باقة السنة (950 ج)</option>
  </select>
  <input class="f" id="cPrice" type="number" placeholder="السعر بالجنيه (مثال: 150)">
  <input class="f" id="cImg" placeholder="اسم الصورة أو رابطها (مثال: dr1.jpg أو dr2.jpg)" value="dr1.jpg">
  <textarea class="f" id="cDesc" rows="3" placeholder="وصف مختصر لمحتوى الكورس..."></textarea>
  <div class="err" id="admErr"></div>
  <button onclick="addCourse()" style="width:100%;background:var(--ok)">نشر الكورس الآن</button>
  <button class="sec" onclick="adminDlg.close()" style="width:100%;margin-top:8px">إغلاق</button>
</dialog>

<script>
const $=id=>document.getElementById(id);
const PLANS={all:'الكل',month:'اشتراك شهري (150 ج)',term:'اشتراك الترم (450 ج)',year:'اشتراك السنة (950 ج)'};
const BADGE={month:'باقة الشهر',term:'باقة الترم',year:'باقة السنة'};
let view='home',plan='all',mode='login',token=localStorage.token,courses=[],mine=[];

async function api(url,opt={}){
  opt.headers={'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})};
  if(opt.body)opt.body=JSON.stringify(opt.body);
  const r=await fetch(url,opt),d=await r.json();
  if(!r.ok)throw new Error(d.error||'حصل خطأ');return d;
}

async function load(){
  courses=await api('/api/courses');
  mine=[];
  if(token){try{mine=(await api('/api/my-courses')).map(c=>c.id)}catch{logout(true)}}
  $('user').innerHTML=token?`<span>أهلاً، <b>${localStorage.name}</b></span><button class="sec" onclick="logout()">خروج</button>`
    :`<button class="sec" onclick="openAuth('login')">تسجيل الدخول</button><button onclick="openAuth('register')">حساب جديد</button>`;
  render();
}

function card(c){
  const on=mine.includes(c.id);
  const img=c.image||'dr1.jpg';
  return `<div class="card">
    <div class="thumb-wrap">
      <img src="${img}" onerror="this.src='dr1.jpg'" alt="${c.title}">
      <span class="plan-tag">${BADGE[c.plan]||c.plan}</span>
      <span class="price-tag">${c.price} جنيه</span>
    </div>
    <div class="card-body">
      <h4>${c.title}</h4>
      <p>${c.desc}</p>
      ${on?'<button disabled>✅ أنت مشترك في هذا الكورس</button>':`<button onclick="enroll(${c.id})">اشترك الآن (${c.price} ج)</button>`}
    </div>
  </div>`;
}

function render(){
  const q=$('q').value.trim(),titles={home:'الرئيسية',all:'جميع الكورسات',mine:'كورساتي'};
  $('title').textContent=titles[view];
  document.querySelectorAll('aside a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v==view));
  let list=courses.filter(c=>(plan=='all'||c.plan==plan)&&(!q||c.title.includes(q)||c.desc.includes(q)));
  if(view=='mine')list=list.filter(c=>mine.includes(c.id));
  let h='';
  if(view=='home'){
    h+=`<div class="hero">
      <div class="hero-text">
        <span class="tag">✨ الطريق الأسهل للتفوق والتميز</span>
        <h1>منصة د. محمد رمضان التعليمية</h1>
        <p>اختر الباقة المناسبة ليك (شهري بـ 150 ج، ترم كامل بـ 450 ج، أو باقة السنة الشاملة بـ 950 ج) وابدأ رحلتك التعليمية بأحدث طرق الشرح والمتابعة.</p>
        <button onclick="view='all';render()">استكشف الكورسات الآن ⬅️</button>
      </div>
      <div class="hero-imgs">
        <img src="dr1.jpg" onerror="this.style.display='none'" alt="د. محمد رمضان">
        <img src="dr2.jpg" onerror="this.style.display='none'" alt="تكريم د. محمد رمضان">
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b style="color:var(--accent)">150 ج</b><span>اشتراك الشهر</span></div>
      <div class="stat"><b style="color:var(--ok)">450 ج</b><span>اشتراك الترم الكامل</span></div>
      <div class="stat"><b style="color:var(--gold)">950 ج</b><span>باقة السنة الشاملة</span></div>
    </div>
    <h2 style="margin-bottom:16px">🔥 الكورسات والباقات المتاحة</h2>
    <div class="grid">${courses.map(card).join('')}</div>`;
  }else{
    h+=`<div class="tabs">${Object.entries(PLANS).map(([k,v])=>`<button class="${k==plan?'on':''}" onclick="plan='${k}';render()">${v}</button>`).join('')}</div>`;
    h+=list.length?`<div class="grid">${list.map(card).join('')}</div>`:'<p style="color:var(--muted)">مفيش كورسات مطابقة لبحثك.</p>';
  }
  $('view').innerHTML=h;
}

document.querySelectorAll('aside a[data-v]').forEach(a=>a.onclick=()=>{
  if(a.dataset.v=='mine'&&!token)return openAuth('login');
  view=a.dataset.v;plan='all';side.classList.remove('open');render()});
$('acc').onclick=()=>token?alert('بيانات حسابك:\nالاسم: '+localStorage.name):openAuth('login');

function openAuth(m){
  mode=m;$('dt').textContent=m=='login'?'تسجيل الدخول':'إنشاء حساب طالب جديد';
  $('name').style.display=$('phone').style.display=m=='login'?'none':'block';
  $('err').textContent='';dlg.showModal();
}
async function submitAuth(){
  try{
    const d=await api('/api/'+mode,{method:'POST',body:{email:$('email').value,password:$('pass').value,name:$('name').value,phone:$('phone').value}});
    token=localStorage.token=d.token;localStorage.name=d.name;dlg.close();load();
  }catch(e){$('err').textContent=e.message}
}
function logout(s){localStorage.clear();token=null;mine=[];view='home';if(!s)load()}
async function enroll(id){
  if(!token)return openAuth('login');
  try{await api('/api/enroll',{method:'POST',body:{courseId:id}});await load();alert('تم الاشتراك في الكورس بنجاح ✅')}
  catch(e){alert(e.message)}
}

function openAdmin(){
  $('admErr').textContent='';
  adminDlg.showModal();
}
async function addCourse(){
  try{
    await api('/api/admin/courses',{
      method:'POST',
      headers:{'x-admin-password':$('admPass').value},
      body:{
        title:$('cTitle').value,
        plan:$('cPlan').value,
        price:$('cPrice').value,
        image:$('cImg').value,
        desc:$('cDesc').value
      }
    });
    adminDlg.close();
    await load();
    alert('تم نشر الكورس بنجاح ✅');
  }catch(e){$('admErr').textContent=e.message}
}
load();
</script>
</body>
</html>
